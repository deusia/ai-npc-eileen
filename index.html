<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>归潮之灯 · 艾琳</title><style>
:root{font-family:system-ui,sans-serif;color:#f1e9db;background:#171c20}body{max-width:850px;margin:0 auto;padding:24px}header{padding:20px 0;border-bottom:1px solid #555}h1{margin:0;font-size:28px}p{color:#bfb6a8}.sessions{display:flex;align-items:center;gap:10px;margin:16px 0}select{flex:1;padding:10px;border-radius:8px;background:#272d30;color:white;font:inherit}#world{padding:14px;background:#292f31;border-radius:10px}#messages{min-height:38vh;max-height:55vh;overflow:auto;padding:16px 0}.message{padding:12px 16px;margin:10px 0;border-radius:12px;white-space:pre-wrap;line-height:1.6;background:#303839}.user{background:#4b3c31;margin-left:15%}.assistant{margin-right:15%}.event{background:#303247;color:#ddd}details{margin-bottom:8px;color:#c4b9a7;font-size:0.9em}summary{cursor:pointer}details pre{white-space:pre-wrap;font:inherit;max-height:220px;overflow:auto}form{display:flex;gap:8px}textarea{flex:1;resize:vertical;min-height:55px;padding:10px;border-radius:8px;background:#272d30;color:white;font:inherit}button{background:#d6aa73;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#error{color:#ffb2a7}#quote{margin-top:10px}
</style></head><body><header><h1>归潮之灯</h1><p>雾港镇 · 归潮之灯，一段跨越世界的相遇。</p></header><main><div class="sessions"><label for="sessions">当前会话</label> <select id="sessions" aria-label="选择会话"></select> <button id="new" type="button">新建会话</button></div><div class="sessions"><label for="provider">对话模型</label><select id="provider"><option value="local">本地 · LM Studio 千问</option><option value="openai">云端 · GPT-6 Luna</option></select></div><p id="providerInfo" hidden>使用云端模型时，本次会话相关对话、角色设定、记忆及世界状态会发送至 OpenAI，并产生 API 费用。后台自主事件仍使用本地模型。云端仅展示模型返回的推理摘要（如有）。</p><div id="world"></div><p id="opening" aria-live="polite"></p><div id="quote"></div><div id="messages" aria-live="polite"></div><form id="form"><label for="input" hidden>对艾琳说</label><textarea id="input" maxlength="2000" placeholder="对艾琳说些什么……" required></textarea><button id="send">发送</button></form><p id="error" role="alert"></p></main><script>
const $=id=>document.getElementById(id), messages=$('messages');
let sessionId=Number(localStorage.getItem('eileen_session')) || 1;
function busy(value){$('send').disabled=value;$('new').disabled=value;$('sessions').disabled=value;$('provider').disabled=value}
function add(role,text,reasoning=''){const el=document.createElement('div');el.className='message '+role;if(role==='assistant'){const details=document.createElement('details'),summary=document.createElement('summary'),thought=document.createElement('pre'),content=document.createElement('div');summary.textContent='思考过程 / 摘要';thought.textContent=reasoning;details.hidden=!reasoning;details.append(summary,thought);content.textContent='艾琳：'+text;el.append(details,content);el.thought=thought;el.details=details;el.content=content}else{el.textContent=(role==='user'?'你：':'旅店：')+text}messages.append(el);messages.scrollTop=messages.scrollHeight;return el}
function show(data){$('opening').textContent=data.opening||'';const time=data.story_time?`第 ${data.story_time.day} 天 · ${data.story_time.period} ${String(data.story_time.hour).padStart(2,'0')}:${String(data.story_time.minute).padStart(2,'0')} · `:'';$('world').textContent=time+`空房 ${data.world.rooms} 间 · 你的金币 ${data.world.coins} · 标准房价 20 金币 / 晚`;$('quote').replaceChildren();if(data.quote){const label=document.createElement('span');label.textContent=`待确认：住宿 ${data.quote.days} 天，总价 ${data.quote.price} 金币；点击按钮才会预订。 `;const button=document.createElement('button');button.textContent='确认预订';button.onclick=()=>confirmQuote(data.quote.id,button);$('quote').append(label,button)}}
async function request(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function confirmQuote(id,button){button.disabled=true;busy(true);try{const d=await request('/api/confirm',{quote_id:id,session_id:sessionId});show(d);add('event',d.result);$('error').textContent=''}catch(e){$('error').textContent=e.message;button.disabled=false}finally{busy(false)}}
$('form').onsubmit=async e=>{e.preventDefault();const input=$('input'),value=input.value.trim();if(!value)return;busy(true);$('error').textContent='';const user=add('user',value), reply=add('assistant','');reply.content.textContent='艾琳：正在思考…';let content='',complete=false;try{const response=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:value,session_id:sessionId,provider:$('provider').value})});if(!response.ok)throw Error('无法开始对话');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {value:chunk,done}=await reader.read();buffer+=decoder.decode(chunk||new Uint8Array(),{stream:!done});let newline;while((newline=buffer.indexOf('\n'))>=0){const line=buffer.slice(0,newline);buffer=buffer.slice(newline+1);if(!line)continue;const event=JSON.parse(line);if(event.type==='reasoning'){reply.details.hidden=false;reply.thought.textContent+=event.data}else if(event.type==='content'){content+=event.data;reply.content.textContent='艾琳：'+content}else if(event.type==='tool'){content='';reply.content.textContent='艾琳：正在处理…'}else if(event.type==='done'){complete=true;reply.content.textContent='艾琳：'+event.data.reply;input.value='';show(event.data)}else if(event.type==='error')throw Error(event.data);messages.scrollTop=messages.scrollHeight}if(done)break}if(!complete)throw Error('连接中断');}catch(err){user.classList.add('event');reply.classList.add('event');reply.content.textContent+='\n（未完成：本轮结果可能未保存，请复制需要的内容，刷新确认后再重试。）';$('error').textContent=err.message.replace(/[。.!！]+$/,'')+'。输入内容已保留，可检查或重试。'}finally{busy(false);input.focus()}};
async function loadSessions(){const r=await fetch('/api/sessions');if(!r.ok)throw Error('无法读取会话');const data=await r.json();$('sessions').replaceChildren();for(const session of data.sessions){const option=document.createElement('option');option.value=session.id;option.textContent=session.name;$('sessions').append(option)}if(!data.sessions.some(s=>s.id===sessionId))sessionId=data.sessions[0].id;$('sessions').value=String(sessionId)}
async function loadState(){const r=await fetch('/api/state?session_id='+sessionId);const d=await r.json();if(!r.ok)throw Error(d.error);messages.replaceChildren();show(d);d.messages.forEach(m=>add(m.role,m.content,m.reasoning));localStorage.setItem('eileen_session',String(sessionId))}
$('provider').onchange=()=>{$('providerInfo').hidden=$('provider').value!=='openai'};
$('sessions').onchange=async e=>{busy(true);const previous=sessionId;sessionId=Number(e.target.value);try{await loadState();$('error').textContent=''}catch(err){sessionId=previous;e.target.value=String(previous);$('error').textContent=err.message}finally{busy(false)}};
$('new').onclick=async()=>{busy(true);try{const d=await request('/api/sessions',{});sessionId=d.id;await loadSessions();await loadState();$('error').textContent=''}catch(err){$('error').textContent=err.message}finally{busy(false)}};
busy(true);loadSessions().then(loadState).catch(err=>$('error').textContent=err.message).finally(()=>busy(false));
</script></body></html>
